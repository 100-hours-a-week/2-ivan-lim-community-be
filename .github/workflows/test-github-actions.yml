name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code # 리포지토리 코드를 가져옴
        uses: actions/checkout@v3

      - name: Set up Node.js # Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies # 의존성 설치
        run: npm install

      - name: Run Tests # 테스트 실행
        run: npm test

      - name: Build Project # 프로젝트 빌드
        run: npm run build

      - name: Deploy to Server # 서버에 배포
        run: ./deploy.sh
