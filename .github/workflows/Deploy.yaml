name: Zero Downtime Deployment

on:
  push:
    branches:
      - ec2_server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.set-version.outputs.TAG }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        id: set-version
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S') # Timestamp 기반으로 버전 관리.
          TAG=ivan-${TIMESTAMP}
          echo TAG=ivan-${TIMESTAMP} >> $GITHUB_OUTPUT # 다른 job에서도 사용할 수 있도록 환경 변수를 저장.
          # echo TAG=ivan-${TIMESTAMP} >> $GITHUB_ENV # 해당 job 내에서만 TAG이라는 환경 변수를 사용.
          # echo "::set-output name=TAG::$TIMESTAMP" # 권장 방법은 아니지만, 다른 job에서 사용할 수 있도록 환경 변수를 저장.

          # 하나는 대괄호 쓰고 하나는 안썼는데 결과 동일. 둘 다 사용 가능.
          docker build -t ghcr.io/${{ github.repository_owner }}/my-app:$TAG .
          docker push ghcr.io/${{ github.repository_owner }}/my-app:${TAG}

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > key.pem
          chmod 600 key.pem

      - name: Deploy to EC2
        run: |
          HOST=${{ secrets.EC2_HOST }}
          USER=${{ secrets.EC2_USER }}
          NGINX_CONF=${{ vars.NGINX_CONF }}
          # NGINX_CONF=/etc/nginx/nginx.conf
          CURRENT_PORT=$(ssh -o StrictHostKeyChecking=no -i key.pem $USER@$HOST "grep -A 1 'upstream backend' ${NGINX_CONF} | grep -Eo '[0-9]+'")
          TAG="${{ needs.build-and-push.outputs.TAG }}" # 얜 또 따옴표가 있어야 된다;;

          # SSH 접속 후 배포 작업 수행
          ssh -o StrictHostKeyChecking=no -i key.pem $USER@$HOST << EOF
            echo "Starting deployment..."

            # Nginx 설정 파일 확인
            if [ ! -f "${NGINX_CONF}" ]; then
              echo "Error: Nginx configuration file not found at ${NGINX_CONF}."
              exit 1
            
            else
              echo "Nginx configuration file found at ${NGINX_CONF}."
            fi

            # 포트가 제대로 추출되었는지 확인
            if [ -z "$CURRENT_PORT" ]; then
              echo "Error: Could not find the current port in $NGINX_CONF."
              exit 1
            fi

            # 다음 포트 계산
            if [ "$CURRENT_PORT" -eq 3030 ]; then
              NEXT_PORT=3031
              CURRENT_VERSION=GREEN
              NEXT_VERSION=BLUE
            else
              NEXT_PORT=3030
              CURRENT_VERSION=BLUE
              NEXT_VERSION=GREEN
            fi

            echo "Current port: $CURRENT_PORT, Next port: \$NEXT_PORT" # 왜 NEXT_PORT만 백슬랙시로 감싸야만 하지;;
            echo "Deploying version $NEXT_VERSION to $HOST..."

            # Docker Registry 로그인
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}

            # 새로운 컨테이너 실행
            echo "docker pull ghcr.io/${{ github.repository_owner }}/my-app:$TAG"
            echo "Pulling and running the new container..."
            docker pull ghcr.io/${{ github.repository_owner }}/my-app:$TAG
            echo "docker run -d --name back-\${NEXT_VERSION} -p \${NEXT_PORT}:3030 ghcr.io/${{ github.repository_owner }}/my-app:$TAG"
            echo "Running the new container..."
            docker run -d --name back-\${NEXT_VERSION} -p \${NEXT_PORT}:3030 ghcr.io/${{ github.repository_owner }}/my-app:$TAG

            # 헬스체크 수행
            echo "Performing health check on port \${NEXT_PORT}..."
            for i in {1..10}; do
              curl -sf http://localhost:\${NEXT_PORT} && break
              echo "Health check failed, retrying... (\$i/10)"
              sleep 5
            done

            if ! curl -sf http://localhost:\${NEXT_PORT}; then
              echo "Health check failed. Rolling back..."
              docker rm -f back-\${NEXT_VERSION}
              exit 1
            fi

            # Nginx 설정 업데이트
            sudo sed -i "s/server localhost:\${CURRENT_PORT}/server localhost:\${NEXT_PORT}/" ${NGINX_CONF}
            sudo nginx -s reload

            # 이전 컨테이너 정리
            docker rm -f back-\${CURRENT_VERSION}
            docker system prune -a -f
          EOF
